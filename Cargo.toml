[package]
name = "splash-boot-manager"
version = "0.1.11"
edition = "2021"
description = "SplashOS LinuxBoot-style graphical boot manager"
license = "GPL-2.0-or-later"

[dependencies]
gtk = { package = "gtk4", version = "0.9" }
adw = { package = "libadwaita", version = "0.7", features = ["v1_4"] }

[profile.release]
lto = true
strip = true
